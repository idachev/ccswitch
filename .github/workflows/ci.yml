name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

jobs:
  check:
    # Native Security.framework calls are mocked; filesystem concurrency uses
    # real child processes. The suite runs without access to real credentials.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run ruff check src tests

      - run: uv run pytest
